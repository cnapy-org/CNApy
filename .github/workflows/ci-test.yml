name: CI Test

on:
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
      - name: Install Qt runtime libraries for the offscreen platform plugin
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon0 libxcb-cursor0 libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.2" pytest-qt
      - name: Install CNApy
        run: pip install .
      - name: Run all tests in the cnapy/tests folder
        run: pytest -v ./cnapy/tests