name: CI Test

on: [pull_request]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  build-linux:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Qt runtime libraries for the offscreen platform plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon0 libxcb-cursor0 libegl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.2" pytest-qt
      - name: Install CNApy
        run: |
          pip install .
      - name: Test CNApy
        run: |
          pytest -v ./cnapy/tests/test.py
      - name: Run FBA/FVA CI tests
        run: |
          pytest -v ./cnapy/tests/test_core_units.py ./cnapy/tests/test_mainwindow_slots.py

  build-windows:
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.2" pytest-qt
      - name: Install CNApy
        run: |
          pip install .
      - name: Test CNApy
        run: |
          pytest -v ./cnapy/tests/test.py
      - name: Run FBA/FVA CI tests
        run: |
          pytest -v ./cnapy/tests/test_core_units.py ./cnapy/tests/test_mainwindow_slots.py

  build-macos:
    runs-on: "macos-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.2" pytest-qt
      - name: Install CNApy
        run: |
          pip install .
      - name: Test CNApy
        run: |
          pytest -v ./cnapy/tests/test.py
      - name: Run FBA/FVA CI tests
        run: |
          pytest -v ./cnapy/tests/test_core_units.py ./cnapy/tests/test_mainwindow_slots.py
